[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1000
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = []
gas_limit = "300000000"
# Every top-level call in a test is its own transaction, so transient storage (the hook's pending
# credit) is cleared between them, as on chain.
isolate = true

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 64

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
